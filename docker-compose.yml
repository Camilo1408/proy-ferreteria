# nombre: docker-compose.yml
# descripcion: Entorno local completo (PostgreSQL + API + front-end) que simula producción.
# fecha_creacion: 2026-10-07
# actualizacion: 2026-10-07
# autor: Camilo1408
# version: 1.0.0
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ferreteria
      POSTGRES_USER: ferreteria
      POSTGRES_PASSWORD: ferreteria
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferreteria -d ferreteria"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ferreteria
      SPRING_DATASOURCE_USERNAME: ferreteria
      SPRING_DATASOURCE_PASSWORD: ferreteria
      DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-local-compose-secret-12345}
      CORS_ORIGINS: http://localhost:8081
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  dbdata:
