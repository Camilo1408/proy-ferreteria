# nombre: render.yaml
# descripcion: Blueprint de Render (referencia de la infraestructura desplegada; los servicios reales se crearon con la CLI).
# fecha_creacion: 2026-10-07
# actualizacion: 2026-10-07
# autor: Camilo1408
# version: 1.0.0
services:
  - type: web
    name: ferreteria-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DDL_AUTO
        value: update
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx320m -XX:+UseSerialGC
  - type: web
    name: ferreteria-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
